[project]
name = "hermes-cdp-attach"
version = "0.1.0"
description = "Hermes plugin: lazy-attach the Android Chrome CDP forward before any browser_* tool runs."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
